<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160d24">
<title>Ghost Ban-doh: Lights Out!</title>
<style>
:root{
  --ink:#160d24;      /* night street */
  --plum:#26163f;     /* raised surfaces */
  --plum2:#3a2260;
  --line:#7a5cc0;
  --accent:#ffb347;   /* lantern light: primary action */
  --accent-d:#d98a1c;
  --on:#2a1600;
  --custard:#ffe9b8;
  --ink2:#5a4a86;
  --bone:#f7f2ff;
  --muted:#cdbdf0;
  --mint:#8fe3b0;
  --berry:#ff7a8a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--ink);
  background-image:radial-gradient(900px 480px at 50% -140px,#5a2a8a 0,transparent 70%);
  background-attachment:fixed;
  color:var(--bone);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;min-height:100vh;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.55rem;letter-spacing:.01em}
h3{font-size:1.05rem}
p{margin:.4em 0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--custard);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(22,13,36,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;min-width:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tright{display:flex;align-items:center;gap:8px}
.timerwrap{position:relative}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--plum);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.timer.stopped{background:var(--custard);color:var(--ink);border-color:var(--custard)}
.plus{position:absolute;right:6px;top:100%;margin-top:2px;font-weight:800;color:var(--berry);opacity:0;pointer-events:none}
.plus.go{animation:plus 1.4s ease-out}
@keyframes plus{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}
.sfxbtn{width:40px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--plum);cursor:pointer;font-size:1.05rem;padding:0}
main{max-width:520px;margin:0 auto;padding:16px 16px 48px}

/* surfaces */
.card{background:var(--plum);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.card h3{margin-bottom:6px}
.note{color:var(--muted);font-size:.92rem}
.zh{color:var(--muted);font-size:.92rem}
.back{display:inline-block;text-decoration:none;color:var(--muted);padding:6px 0;font-size:.95rem}
.ok-card{border-color:var(--mint)!important}
.bad-card{border-color:var(--berry)!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--plum2);font-weight:700;cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.primary:active{background:var(--accent-d)}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--plum2);cursor:pointer;font-size:1.15rem;line-height:1;padding:0}
.spk.speaking{background:var(--accent);border-color:var(--accent);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;font-size:.92rem}

/* forms */
input[type=text],input[type=number],input[type=tel],select{width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--bone)}
select{appearance:auto}
input::placeholder{color:#8f80c4}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:.92rem;color:var(--muted);margin-bottom:4px}

/* station header */
.st-head{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.st-emoji{font-size:2.4rem;line-height:1;flex:none}
.st-head .kick{color:var(--custard);font-weight:700;font-size:.95rem}
.story{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:8px 0 4px}
.zhbox{background:var(--plum);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:4px 0 8px;color:var(--muted)}

/* listening player */
.player{text-align:center}
.bigplay{width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font-size:2.4rem;cursor:pointer;box-shadow:0 6px 0 var(--accent-d)}
.bigplay:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-d)}
.bigplay.speaking{animation:pulse .9s ease-in-out infinite}
.playnote{margin-top:10px;color:var(--muted);font-size:.9rem}

/* question card */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}
.bat{letter-spacing:.1em;white-space:nowrap}
.bat .lost{opacity:.22;filter:grayscale(1)}
.bulbs{display:flex;gap:4px;justify-content:center;margin:2px 0 8px}
.bulbs i{font-style:normal;font-size:1.2rem;filter:grayscale(1);opacity:.35}
.bulbs i.on{filter:none;opacity:1}
.qtext{font-size:1.15rem;font-weight:700;margin:10px 0 4px;text-align:center}
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--plum2);font-weight:700;margin:8px 0;cursor:pointer}
.opt small{margin-left:auto;font-weight:400;color:var(--muted);white-space:nowrap}
.opt.ok{border-color:var(--mint);background:rgba(143,227,176,.18)}
.opt.bad{border-color:var(--berry);background:rgba(255,122,138,.16)}
.opt.struck{opacity:.3;text-decoration:line-through}
.opt[disabled]{cursor:default}
.feed{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-weight:600}
.feed:empty{display:none}
.feed.good{background:rgba(143,227,176,.15);border:2px solid var(--mint)}
.feed.nope{background:rgba(255,122,138,.16);border:2px solid var(--berry)}

/* dictation tiles */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 10px}
.slot{width:34px;height:46px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--ink)}
.slot.f{border-style:solid;border-color:var(--custard);background:var(--plum2)}
.slot.vis{border-style:solid;border-color:transparent;background:var(--plum)}
.slot.given{border-color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tile{width:46px;height:52px;border-radius:10px;border:2px solid var(--line);background:var(--plum2);font-size:1.4rem;font-weight:800;cursor:pointer;padding:0}
.tile[disabled]{opacity:.2;cursor:default}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .btn{flex:1}

/* ordering */
.ordslot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:var(--ink)}
.ordslot>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--plum2);display:grid;place-items:center;font-size:.85rem}
.ordslot.f{border-style:solid;border-color:var(--custard);cursor:pointer}
.ordcards{display:grid;gap:8px;margin:8px 0}
.ordcards button{text-align:left;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--plum2);font-weight:700;cursor:pointer}
.ordcards button[disabled]{opacity:.25;cursor:default}

/* walkie-talkie */
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ink);border:2px solid var(--accent);margin:8px 0}
.who .e{font-size:1.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem}
.code{display:inline-block;font-variant-numeric:tabular-nums;letter-spacing:.12em;background:var(--custard);color:var(--ink);border-radius:8px;padding:0 8px;font-weight:800}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--plum);font-weight:800;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}

/* messages & hints */
.msg{margin:10px 0;padding:10px 12px;border-radius:12px;font-weight:600}
.msg:empty{display:none}
.msg.bad{background:rgba(255,122,138,.16);border:2px solid var(--berry)}
.msg.info{background:var(--plum2);border:2px solid var(--line)}
.hint{background:var(--ink);border:2px dashed var(--custard);border-radius:12px;padding:8px 12px;margin:8px 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* unlock result */
.result{margin:14px 0;padding:16px;border-radius:var(--r);background:var(--custard);color:var(--ink);text-align:center}
.result .big{font-size:3.2rem;font-weight:800;line-height:1.1;margin:2px 0}
.result.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.result .note{color:var(--ink2)}

/* home */
.hero{text-align:center;padding:10px 0 2px}
.hero .big{font-size:3.4rem;line-height:1}
.tent{display:flex;justify-content:center;gap:6px;margin:6px 0 2px;padding:8px 0;border-radius:12px;background:linear-gradient(#0c0616,#1d1030)}
.lamp{font-size:1.9rem;filter:grayscale(1) brightness(.6);opacity:.55;animation:flick 2.4s steps(1) infinite}
.lamp.on{filter:drop-shadow(0 0 8px #ffb347);opacity:1;animation:none}
@keyframes flick{0%{opacity:.55}10%{opacity:.2}12%{opacity:.6}60%{opacity:.35}62%{opacity:.7}100%{opacity:.55}}
.locks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.lock{background:var(--ink);border:2px dashed var(--line);border-radius:12px;text-align:center;padding:6px 0 8px}
.lock small{display:block;color:var(--muted);font-size:.68rem}
.lock b{font-size:1.4rem}
.lock.on{border-style:solid;border-color:var(--custard);background:var(--plum2)}
.slist{display:grid;gap:8px;margin:8px 0}
.slist a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--plum);border:2px solid var(--line);text-decoration:none}
.slist a.done{border-color:var(--mint)}
.slist .e{font-size:1.7rem}
.slist .t{flex:1;line-height:1.25}
.slist .t small{display:block;color:var(--muted)}
.slist .chk{font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}

/* final */
.wire{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.wire div{background:var(--ink);border-radius:10px;padding:4px 0;font-size:.78rem;color:var(--muted)}
.wire b{display:block;color:var(--custard);font-size:1.05rem}
.lockin{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lockin label{display:block;text-align:center;font-size:.72rem;color:var(--muted)}
.lockin input{text-align:center;font-size:1.5rem;font-weight:800;text-transform:uppercase;padding:6px 0;min-width:0}
.lockin input.bad{border-color:var(--berry)}
.lockin input.ok{border-color:var(--mint)}

/* receipt */
.receipt{position:relative;background:var(--custard);color:var(--ink);padding:20px 18px 26px;margin:18px 0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans TC",monospace;
  -webkit-mask:radial-gradient(circle 8px at 50% 100%,transparent 98%,#000) bottom/16px 51% repeat-x,linear-gradient(#000,#000) top/100% 50% no-repeat;
  mask:radial-gradient(circle 8px at 50% 100%,transparent 98%,#000) bottom/16px 51% repeat-x,linear-gradient(#000,#000) top/100% 50% no-repeat}
.receipt h2{text-align:center;font-size:1.25rem;margin-bottom:2px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:2px dashed rgba(22,13,36,.45);margin:10px 0}
.receipt .row{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;padding:1px 0}
.receipt .row b{text-align:right}
.receipt .name{font-size:1.5rem;font-weight:800;text-align:center;word-break:break-word}
.receipt .spell{font-size:2rem;letter-spacing:.25em;text-align:center;font-weight:800;margin:4px 0 0 .25em}
.receipt .lamps{text-align:center;font-size:1.4rem;letter-spacing:.2em}

/* effects */
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:rgba(255,60,80,.38);opacity:0}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#lock{position:fixed;inset:0;z-index:50;background:rgba(10,4,20,.94);display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
.lockbox{text-align:center;max-width:320px}
.lockbox .big{font-size:3.6rem}
.lockbox .count{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){
  body{font-size:16px}
  .tile{width:42px;height:48px}
  .lockin input{font-size:1.25rem}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><span aria-hidden="true">🏮</span><span>Ghost Ban-doh</span></a>
  <div class="tright">
    <button class="sfxbtn" id="sfxbtn" type="button" aria-label="Sound effects on or off 音效開關">🔔</button>
    <div class="timerwrap"><div class="timer" id="timer" hidden>⏱ <span id="tm">00:00</span></div><span class="plus" id="plus" aria-live="polite"></span></div>
  </div>
</header>
<main id="view"></main>
<div id="flash" aria-hidden="true"></div>
<div id="lock" hidden role="alert"><div class="lockbox"><div class="big">🔌</div><h2>Short circuit! 短路了！</h2>
  <p>The battery is empty. Recharging… 電量用完，充電中…</p><div class="count" id="lockn">30</div>
  <p class="note">Think about what you heard. Talk with your group. 想一想剛才聽到的，和同組討論。</p></div></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){r=r||Math.random;const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- state (localStorage keeps the timer alive when a new QR code is scanned) ---------- */
const KEY='b3l4-lights.v1';
const PEN=10000;      // each hint adds 10 seconds
const HINTMAX=3;      // hints per station
const BAT=3;          // battery per station
const LOCKMS=30000;   // recharge time when the battery is empty
function fresh(){return {name:'',seat:'',grp:'',startTs:0,endTs:0,finalMs:0,done:{},hints:{},wrong:{},bat:{},lockUntil:0,pair:null};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&typeof s==='object'?Object.assign(fresh(),s):fresh();}catch(e){return fresh();}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function sync(){S=load();}
const hintsTotal=()=>Object.values(S.hints).reduce((a,b)=>a+b,0);
const wrongTotal=()=>Object.values(S.wrong).reduce((a,b)=>a+b,0);
const elapsed=()=>S.endTs?S.finalMs:(Date.now()-S.startTs+hintsTotal()*PEN);
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):pad(m))+':'+pad(x);}
function stamp(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}

function tick(){
  const t=$('#timer');
  if(!S.startTs){t.hidden=true;return;}
  t.hidden=false;
  $('#tm').textContent=fmt(elapsed());
  t.classList.toggle('stopped',!!S.endTs);
}
setInterval(tick,1000);
window.addEventListener('storage',e=>{if(e.key===KEY){sync();tick();}});
function flashPlus(){const p=$('#plus');p.textContent='+'+(PEN/1000)+'s';p.classList.remove('go');void p.offsetWidth;p.classList.add('go');}

/* ---------- sound effects (made by the phone, no sound files) ---------- */
const SFX=(function(){
  let ctx=null,on=true;
  try{on=localStorage.getItem('b3l4.sfx')!=='0';}catch(e){}
  function ac(){
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C();}catch(e){return null;}}
    if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    return ctx;
  }
  function tone(f,t0,dur,type,vol,f2){
    const c=ac();if(!c)return;
    try{
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.03);
    }catch(e){}
  }
  function noise(t0,dur,vol){
    const c=ac();if(!c)return;
    try{
      const n=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
      const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=vol||0.2;s.connect(g);g.connect(c.destination);s.start(c.currentTime+t0);
    }catch(e){}
  }
  return {
    get on(){return on;},
    set(v){on=!!v;try{localStorage.setItem('b3l4.sfx',on?'1':'0');}catch(e){}},
    prime(){ac();},
    ding(){if(!on)return;tone(880,0,.14,'sine',.26);tone(1320,.11,.34,'sine',.26);},
    buzz(){if(!on)return;tone(130,0,.4,'sawtooth',.22,66);tone(140,0,.4,'square',.1,70);noise(0,.14,.18);try{if(navigator.vibrate)navigator.vibrate([90,40,140]);}catch(e){}},
    unlock(){if(!on)return;noise(0,.06,.3);tone(220,.08,.5,'triangle',.2,880);[660,830,990].forEach((f,i)=>tone(f,.55+i*.1,.32,'sine',.2));},
    fanfare(){if(!on)return;[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.15,.32,'triangle',.24));},
    power(){if(!on)return;tone(180,0,.4,'sawtooth',.12,720);},
    // these two are part of the listening content, so they ignore the on/off switch
    beep(){tone(1000,0,.32,'sine',.22);},
    ring(){tone(660,0,.16,'sine',.2);tone(880,.2,.16,'sine',.2);tone(660,.5,.16,'sine',.2);tone(880,.7,.16,'sine',.2);}
  };
})();
function wireSfxBtn(){
  const b=$('#sfxbtn');
  const paint=()=>{b.textContent=SFX.on?'🔔':'🔕';b.setAttribute('aria-pressed',String(SFX.on));};
  b.onclick=()=>{SFX.set(!SFX.on);SFX.prime();paint();if(SFX.on)SFX.ding();};
  paint();
}
document.addEventListener('pointerdown',()=>SFX.prime(),{once:true});

/* ---------- speech (the phone reads aloud, each character has its own voice) ---------- */
const V={
  lantern:{p:.85,r:.82},   // Uncle Lantern
  granny:{p:.55,r:.78},    // Granny Ghost
  chef:{p:1.0,r:.85},      // Chef Ghost
  kid:{p:1.55,r:.85},      // little ghost on the phone
  plain:{p:1,r:.82}
};
function seq(text,voice){ // split "(beep)" out of a sentence
  const v=V[voice||'plain'];
  const parts=text.split('(beep)'),out=[];
  parts.forEach((p,i)=>{
    const t=p.trim();
    if(t)out.push({t:t,p:v.p,r:v.r});
    if(i<parts.length-1)out.push({beep:1});
  });
  return out;
}
const TTS=(function(){
  const ok='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
  let voice=null,token=0,activeBtn=null;
  function pick(){
    if(!ok)return;
    const vs=speechSynthesis.getVoices()||[];
    voice=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  }
  if(ok){pick();try{speechSynthesis.addEventListener('voiceschanged',pick);}catch(e){}}
  function clearBtn(){if(activeBtn){activeBtn.classList.remove('speaking');activeBtn=null;}}
  let laterT=null;
  function later(fn,ms){clearTimeout(laterT);laterT=setTimeout(fn,ms);}
  function stop(){token++;clearTimeout(laterT);clearBtn();if(ok){try{speechSynthesis.cancel();}catch(e){}}}
  function say(text,rate,pitch){
    return new Promise(res=>{
      if(!ok){res(false);return;}
      const my=token;let done=false,t;
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||0.82;u.pitch=pitch||1;
      const fin=()=>{if(done)return;done=true;clearTimeout(t);res(my===token);};
      u.onend=fin;u.onerror=fin;
      t=setTimeout(fin,3000+text.length*130); // safety net if a phone never fires onend
      try{speechSynthesis.speak(u);}catch(e){fin();}
    });
  }
  async function play(items,opts){
    opts=opts||{};
    stop();
    const my=token;
    if(opts.btn){activeBtn=opts.btn;opts.btn.classList.add('speaking');}
    for(let i=0;i<items.length;i++){
      if(my!==token)return;
      const it=items[i];
      if(typeof it==='string')await say(it,opts.rate,opts.pitch);
      else if(it.beep){SFX.beep();await sleep(520);}
      else if(it.ring){SFX.ring();await sleep(1100);}
      else if(it.gapOnly){await sleep(it.gapOnly);}
      else await say(it.t,it.r||opts.rate,it.p||opts.pitch);
      if(my!==token)return;
      if(i<items.length-1)await sleep(opts.gap||450);
    }
    if(my===token)clearBtn();
    return my===token;   // true only if it played to the end without being stopped
  }
  return {ok,stop,play,later};
})();
function noVoice(){setMsg('This phone cannot read aloud. Ask your teacher. 這支手機無法朗讀，請問老師。','info');}
// any button with data-say reads its text aloud once; tapping it again stops it
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(!b)return;
  if(b.classList.contains('speaking')){TTS.stop();return;}
  if(!TTS.ok){noVoice();return;}
  TTS.play([b.dataset.say],{btn:b});
});
// a play button: toggles playing a list of items
function wirePlay(btn,getItems,opts){
  btn.onclick=()=>{
    SFX.prime();
    if(btn.classList.contains('speaking')){TTS.stop();return;}
    if(!TTS.ok){noVoice();return;}
    const r=TTS.play(getItems(),Object.assign({btn:btn},opts||{}));
    if(opts&&opts.onDone)r.then(done=>{if(done)opts.onDone();});
  };
}

/* ---------- quiz engine for Station 1 and 5 (listen, then choose) ---------- */
function runQuiz(st,cfg){
  const total=cfg.items.length;
  let queue=cfg.items.map((_,i)=>i),solved=0,cur=-1,stage=0,answered=false;
  const mount=$(cfg.mount||'#stage');
  mount.innerHTML=`<div class="card" id="qcard"></div>`;
  function optionsFor(it){
    const decoys=cfg.decoys?cfg.decoys(it):it.d;
    return shuffle([it.a].concat(shuffle(decoys).slice(0,3)));
  }
  function draw(){
    sync();
    if(!queue.length){finishStation(st,cfg.line);$('#qcard').hidden=true;return;}
    cur=queue.shift();stage=0;answered=false;showHint('');
    const it=cfg.items[cur],opts=optionsFor(it);
    const card=$('#qcard');
    card.innerHTML=`<div class="qtop"><span>${esc(cfg.label)} ${solved+1}/${total}</span><span class="bat" id="bat">${batHTML(st.key)}</span></div>
      ${bulbsHTML(total,solved)}
      <div class="player"><button class="bigplay" id="qplay" type="button" aria-label="Play">▶</button>
        <div class="playnote">${esc(cfg.playNote)}</div></div>
      ${cfg.showQ?`<div class="qtext">${esc(it.q)}</div>`:''}
      <div id="opts">${opts.map(o=>`<button class="opt" type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="feed" id="feed"></div>
      <button class="btn primary block" id="next" type="button" hidden style="margin-top:10px">Next ▶ 下一題</button>`;
    wirePlay($('#qplay'),()=>cfg.audio(it));
    $$('.opt',card).forEach(b=>b.onclick=()=>pick(b,it));
    $('#next').onclick=()=>{if(!answered)return;TTS.stop();draw();};
    clearMsg();
  }
  function pick(b,it){
    if(answered)return;
    sync();if(S.lockUntil>Date.now())return;
    answered=true;TTS.stop();
    const good=b.dataset.o===it.a;
    $$('.opt').forEach(o=>o.disabled=true);
    const feed=$('#feed');
    if(good){
      b.classList.add('ok');SFX.ding();solved++;
      feed.className='feed good';feed.innerHTML=`✔ ${esc(it.a)} ${it.aZh?esc(it.aZh):''}`;
      if(cfg.sayAnswer&&TTS.ok)TTS.later(()=>TTS.play([{t:it.a,p:1,r:.8}]),350);
    }else{
      b.classList.add('bad');
      const out=wrongHit(st.key);
      queue.push(cur);
      feed.className='feed nope';feed.textContent='✘ Not that one. Listen again later. 不是這個，等一下會再出現。';
      shake($('#qcard'));
    }
    $('#next').hidden=false;
    if(good&&!queue.length){$('#next').textContent='🔓 Finish! 完成';}
  }
  function hint(){
    if(answered||cur<0)return false;
    const it=cfg.items[cur];
    if(stage===0){showHint('<b>Text 文字：</b>'+esc(it.src));stage=1;return true;}
    if(stage===1){showHint('<b>Text 文字：</b>'+esc(it.src)+'<br><b>中文：</b>'+esc(it.zh));stage=2;return true;}
    setMsg('No more help for this question. 這題沒有更多提示了。','info');return false;
  }
  draw();
  return hint;
}

    `按 ▶ 聽句子（唸兩次，可重複播放），畫面<b>不會顯示句子</b>。畫面上的單字有幾個空格，從下面的字母方塊中，依照順序選出缺的字母補進去，再按「Check」送出。方塊裡有多餘的字母，不是每個都會用到。<br>拼錯扣 1 格電，這個字會晚一點再出現。<br>提示：第 1 次看句子（空格），第 2 次看中文，第 3 次幫你填好一個缺的字母。`,'');
  if(showIfDone(st)){$('#stage').innerHTML='<div class="msg info">This fuse is fixed. 這一站已完成。</div>';wireCommon('s2');return;}
  let queue=shuffle(W.map((_,i)=>i)),solved=0,cur=-1,stage=0,tiles=[],placed=[],miss=[],given=[],busy=false;
  $('#stage').innerHTML='<div class="card" id="qcard"></div>';
  function draw(){
    sync();
    if(!queue.length){finishStation(st,'Letter for fuse 2');$('#qcard').hidden=true;return;}
    cur=queue.shift();stage=0;busy=false;placed=[];given=[];showHint('');clearMsg();
    const it=W[cur],word=it.a;
    miss=it.h.slice();
    const decoys=shuffle(POOL.filter(c=>word.indexOf(c)<0)).slice(0,4);
    tiles=shuffle(miss.map(i=>word[i]).concat(decoys));
    $('#qcard').innerHTML=`<div class="qtop"><span>Word ${solved+1}/${W.length}</span><span class="bat" id="bat">${batHTML(st.key)}</span></div>
      ${bulbsHTML(W.length,solved)}
      <div class="player"><button class="bigplay" id="qplay" type="button" aria-label="Play">▶</button>
        <div class="playnote">Listen for the beep. 注意聽「嗶」的地方。</div></div>
      <div class="slots" id="slots" aria-label="Your word"></div>
      <div class="tiles" id="tiles"></div>
      <div class="row2"><button class="btn" id="back" type="button">⌫ Back 刪除</button><button class="btn primary" id="check" type="button">Check ✔</button></div>
      <div class="feed" id="feed"></div>
      <button class="btn primary block" id="next" type="button" hidden style="margin-top:10px">Next ▶ 下一個</button>`;
    wirePlay($('#qplay'),()=>seq(it.s,'kid').concat([{gapOnly:900}],seq(it.s,'kid')));
    $('#back').onclick=()=>{if(busy)return;placed.pop();paint();};
    $('#check').onclick=check;
    $('#next').onclick=()=>{if(!busy)return;TTS.stop();draw();};
    paint();
  }
  function paint(){
    const word=W[cur].a;
    $('#slots').innerHTML=word.split('').map((ch,i)=>{
      if(given.indexOf(i)>=0)return `<div class="slot f given">${esc(ch)}</div>`;
      const k=miss.indexOf(i);
      if(k<0)return `<div class="slot vis">${esc(ch)}</div>`;
      return `<div class="slot${placed[k]!=null?' f':''}">${placed[k]!=null?esc(tiles[placed[k]]):''}</div>`;
    }).join('');
    $('#tiles').innerHTML=tiles.map((c,i)=>`<button class="tile" type="button" data-i="${i}" ${placed.indexOf(i)>=0||busy?'disabled':''}>${esc(c)}</button>`).join('');
    $$('.tile').forEach(b=>b.onclick=()=>{if(busy)return;if(placed.length>=miss.length)return;placed.push(+b.dataset.i);paint();});
  }
  function check(){
    if(busy)return;
    sync();if(S.lockUntil>Date.now())return;
    const it=W[cur],word=it.a;
    if(placed.length<miss.length){setMsg('Fill all the empty boxes. 空格都要填滿。','bad');shake($('#slots'));return;}
    busy=true;TTS.stop();
    const letters=word.split('');
    miss.forEach((pos,k)=>{letters[pos]=tiles[placed[k]];});
    given.forEach(pos=>{letters[pos]=word[pos];});
    const feed=$('#feed');
    if(letters.join('')===word){
      SFX.ding();solved++;
      feed.className='feed good';feed.innerHTML='✔ '+esc(word)+'<br><span class="note">'+esc(it.s.replace('(beep)',word))+'</span>';
      if(TTS.ok)TTS.later(()=>TTS.play([{t:word,p:1,r:.8}]),350);
      $('#next').hidden=false;
      if(!queue.length)$('#next').textContent='🔓 Finish! 完成';
    }else{
      wrongHit(st.key);queue.push(cur);
      feed.className='feed nope';feed.textContent='✘ Not right. This word will come back later. 拼錯了，晚一點會再出現。';
      shake($('#qcard'));
      $('#next').hidden=false;
    }
    $('#check').disabled=true;$('#back').disabled=true;paint();
  }
  draw();
  wireCommon('s2',()=>{
    if(busy||cur<0)return false;
    const it=W[cur];
    if(stage===0){showHint('<b>Sentence 句子：</b>'+esc(it.s.replace('(beep)','_____')));stage=1;return true;}
    if(stage===1){showHint('<b>Sentence 句子：</b>'+esc(it.s.replace('(beep)','_____'))+'<br><b>中文：</b>'+esc(it.zh));stage=2;return true;}
    if(stage===2&&miss.length>1){
      // fill in the first missing letter for the student
      const pos=miss.shift();given.push(pos);placed=[];
      const ix=tiles.indexOf(it.a[pos]);if(ix>=0)tiles.splice(ix,1);
      paint();stage=3;
      showHint('<b>Sentence 句子：</b>'+esc(it.s.replace('(beep)','_____'))+'<br><b>中文：</b>'+esc(it.zh)+'<br>One letter is filled in for you. 已幫你填好一個字母。');
      return true;
    }
    setMsg('No more help for this word. 這個字沒有更多提示了。','info');return false;
  });
}

];

];
const NEED4=4; // correct answers each person needs
const ROLES=['A','B','C'];
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function p4item(g,n){ // same for everyone in the same group
  const cyc=Math.floor(n/12),k=n%12;
  if(cyc===0){
    if(k<8)return P4[shuffle(P4.map((_,i)=>i),rng(hashStr('m'+g)))[k]];
    return P4R[shuffle(P4R.map((_,i)=>i),rng(hashStr('r'+g)))[k-8]];
  }
  const all=P4.concat(P4R);
  return all[shuffle(all.map((_,i)=>i),rng(hashStr('c'+cyc+'|'+g)))[k]];
}
function p4code(P,n){const h=hashStr(P.g+'|'+P.size+'|'+n);return CODECH[h%32]+CODECH[(h>>>5)%32];}

function renderS4(st){
  sync();

    $('#stage').innerHTML=`<div class="card" id="qcard">${body}</div>`;
    if(iListen)wirePlay($('#qplay'),()=>seq(it.s,'kid').concat([{gapOnly:900}],seq(it.s,'kid')));
    $('#next').onclick=()=>{sync();if(!iListen&&!S.pair.res)return;TTS.stop();S.pair.n++;S.pair.res=null;save();play();};
    $('#rgo').onclick=()=>{const v=parseInt($('#rn').value,10);if(!(v>=1))return;sync();S.pair.n=v-1;S.pair.res=null;save();play();};
    $('#chg').onclick=()=>{sync();S.pair=null;save();setup();};
    if(!iListen){
      const lock=(res)=>{ // show the result of this round again after a refresh
        $$('.opt').forEach(o=>{o.disabled=true;});
        const feed=$('#feed');
        if(res==='ok'){$$('.opt').forEach(o=>{if(o.dataset.o===it.a)o.classList.add('ok');});feed.className='feed good';feed.innerHTML='✔ '+esc(it.a)+'<br><span class="note">'+esc(it.f)+'</span>';}
        else{feed.className='feed nope';feed.textContent='✘ Not right. Talk with your partner. 答錯了，和搭檔討論一下。';}
        $('#next').hidden=false;
      };
      if(p.res)lock(p.res);
      $$('.opt').forEach(b=>b.onclick=()=>{
        sync();if(S.lockUntil>Date.now()||S.pair.res)return;
        const good=b.dataset.o===it.a;
        if(good){
          b.classList.add('ok');SFX.ding();S.pair.ok++;S.pair.res='ok';save();
          lock('ok');
          if(TTS.ok)TTS.later(()=>TTS.play([{t:it.a,p:1,r:.8}]),350);
          if(S.pair.ok>=NEED4&&!S.done[st.key])finishStation(st,'Letter for fuse 4');
        }else{
          b.classList.add('bad');S.pair.res='bad';save();
          wrongHit(st.key);lock('bad');b.classList.add('bad');shake($('#qcard'));
        }
      });
    }
  }
  if(showIfDone(st)){}
  if(!P()||!P().g)setup();else play();
  wireCommon('s4',()=>{
    const p=P();if(!p)return false;
    if(p.res){setMsg('This round is over. 這一輪已結束。','info');return false;}
    const it=p4item(p.g,p.n),roles=ROLES.slice(0,p.size),iListen=p.role===roles[p.n%p.size];
    if(iListen){
      if(hs===0){showHint('<b>Text 文字：</b>'+esc(it.s.replace('(beep)','_____')));hs=1;return true;}
      if(hs===1){showHint('<b>Text 文字：</b>'+esc(it.s.replace('(beep)','_____'))+'<br><b>中文：</b>'+esc(it.zh));hs=2;return true;}
    }else{
      const wrongs=$$('.opt').filter(o=>o.dataset.o!==it.a&&!o.classList.contains('struck'));
      if(hs<2&&wrongs.length>1){wrongs[0].classList.add('struck');wrongs[0].disabled=true;hs++;showHint('One wrong choice is crossed out. 已劃掉一個錯誤選項。');return true;}
    }
    setMsg('No more help for this round. 這一輪沒有更多提示了。','info');return false;
  });
}

/* ---------- Station 5: Granny's Radio (long listening) ---------- */
function renderS5(st){
  const STORY=['Long ago, in the countryside, people had a ban-doh for a big event.','The whole neighborhood worked together.','The host prepared the food.','The neighbors helped to cook, and they brought tables, chairs and bowls.','At night, the host handed out torches.','The guests took bags of leftovers home.','Today, some things have changed, but the spirit of ban-doh remains.','People still gather to have fun together.'];
  const ZHS=['很久以前，在鄉下，人們為了大事舉辦辦桌。','整個社區一起合作。','主人準備食物。','鄰居幫忙煮菜，還帶來桌子、椅子和碗。','晚上，主人分發火把。','客人把一袋袋剩菜帶回家。','今天，有些事情改變了，但辦桌的精神依然存在。','人們仍然聚在一起享受歡樂。'];
  const Q=[
    {q:'Where did ban-doh start?',a:'In the countryside',d:['In a big city','In a school','In a supermarket'],src:STORY[0],zh:ZHS[0]},
    {q:'Who prepared the food?',a:'The host',d:['The guests','The pedestrians','The assistants'],src:STORY[2],zh:ZHS[2]},
    {q:'What did the neighbors bring?',a:'Tables, chairs and bowls',d:['Torches and candy','Cars and buses','Masks and costumes'],src:STORY[3],zh:ZHS[3]},
    {q:'What did the host hand out at night?',a:'Torches',d:['Candy','Tickets','Bowls'],src:STORY[4],zh:ZHS[4]},
    {q:'What did the guests take home?',a:'Bags of leftovers',d:['The tent','The chairs','The cooks'],src:STORY[5],zh:ZHS[5]},
    {q:'What still remains today?',a:'The spirit of gathering together',d:['The old torches','The big tent','Nothing'],src:STORY[6]+' '+STORY[7],zh:ZHS[6]+ZHS[7]}
  ];
  $('#view').innerHTML=frame(st,
    `<p>You are listening to <b>Granny Ghost's radio</b>. She tells the story of the very first ban-doh. <b>Listen to the story. Then answer 6 questions.</b></p><p class="zh">鬼阿嬤的電台正在講最早的辦桌故事。先聽故事，再回答 6 個問題。</p>`,
    `先按 ▶ 聽鬼阿嬤的故事（可重複播放），聽完才會出現問題。問題會顯示文字，但<b>故事不會顯示</b>。每題 4 個選項，選了就送出。<br>答錯扣 1 格電，這題等一下會再出現；電量用完要等 30 秒。提示：第 1 次看故事中相關的一句英文，第 2 次再加中文。`,'');
  if(showIfDone(st)){$('#stage').innerHTML='<div class="msg info">This fuse is fixed. 這一站已完成。</div>';wireCommon('s5');return;}
  $('#stage').innerHTML=`<div class="card player" id="storycard"><h3>📻 Granny's story</h3>
    <button class="bigplay" id="splay" type="button" aria-label="Play the story">▶</button>
    <div class="playnote">Play the whole story. The questions open when the story ends. 要把整段故事聽完，問題才會打開。</div>
    <button class="btn primary block" id="startq" type="button" style="margin-top:12px" disabled>🔒 Questions 問題（Listen first 先聽故事）</button></div>
`;
  const items=[];STORY.forEach(s=>{seq(s,'granny').forEach(x=>items.push(x));});
  const sp=$('#splay');
  // the questions open only after the whole story has been played to the end once
  wirePlay(sp,()=>items,{gap:600,onDone:()=>{$('#startq').disabled=false;$('#startq').textContent='I am ready 我聽完了 → Questions 問題';}});
  if(!TTS.ok)$('#startq').disabled=false;
  let hint=null;
  $('#startq').onclick=()=>{
    TTS.stop();$('#storycard').hidden=true;
    // runQuiz draws into #stage, so give it its own container
    $('#stage').innerHTML='<div id="qmount"></div><div class="card"><button class="btn block" id="replay" type="button">📻 Play the story again 再聽一次故事</button></div>';
    wirePlay($('#replay'),()=>items,{gap:600});
    hint=runQuiz(st,{
      mount:'#qmount',items:Q,label:'Question',playNote:'Read the question. Choose. 讀題目，選答案。',showQ:true,sayAnswer:false,
      decoys:it=>it.d,
      audio:it=>seq(it.q,'lantern'),line:'Letter for fuse 5'
    });
  };
  wireCommon('s5',()=>hint?hint():(setMsg('Listen to the story first. 先聽故事。','info'),false));
}

/* ---------- The Main Switch + receipt ---------- */
function renderFinal(){
  if(S.endTs)return renderReceipt();
  const missing=STATIONS.filter(s=>!S.done[s.key]).map(s=>s.id);
  const tiles=STATIONS.map(st=>{const d=S.done[st.key];return `<div class="lock${d?' on':''}"><small>Fuse ${st.id}</small><b>${d?esc(d.sym):'?'}</b></div>`;}).join('');
  $('#view').innerHTML=`
  <a class="back" href="#home">← Menu 選單</a>
  <div class="st-head"><div class="st-emoji" aria-hidden="true">🔦</div><div><div class="kick">Final</div><h1>The Main Switch</h1><div class="zh">總開關</div></div></div>
  <div class="story"><p>Connect the 5 wires in the right order. Then the lights come on!</p>
    <p class="zh">按照下面的接線順序，把 5 個字母填進去，就能讓燈亮起來。</p></div>
  <button class="linkbtn" id="zhbtn" type="button" aria-expanded="false">🇹🇼 中文說明（免費）</button>
  <div class="zhbox" id="zhbox" hidden>第 1 條線接「保險絲 ${WIRE[0]}」的字母，第 2 條線接「保險絲 ${WIRE[1]}」……依此類推。5 個字母連起來是一個英文單字，也是你想對燈籠伯說的話。</div>
  ${missing.length?`<div class="msg info">You have not fixed fuse ${missing.join(', ')}. Your receipt will show this. 你還沒完成第 ${missing.join('、')} 站，收據上會顯示。</div>`:''}
  <div class="card"><h3>Your fuse letters 你的字母</h3><div class="locks">${tiles}</div></div>
  <div class="card"><h3>Wire order 接線順序</h3>
    <div class="wire">${WIRE.map((f,i)=>`<div>Wire ${i+1}<b>← Fuse ${f}</b></div>`).join('')}</div></div>
  <div class="card"><h3>Connect the wires 接線</h3>
    <div class="lockin">${WIRE.map((f,i)=>`<div><label for="l${i}">Wire ${i+1}</label><input id="l${i}" type="text" maxlength="1" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Wire ${i+1}"></div>`).join('')}</div>
    <button class="btn primary block" id="check" type="button" style="margin-top:12px">Switch ON 🔦</button></div>
  <div class="msg" id="msg" role="status"></div>
  <div id="hintbox"></div><button class="btn ghost block" id="hintbtn" type="button"></button>`;
  const inputs=WIRE.map((_,i)=>$('#l'+i));
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{inp.classList.remove('bad','ok');const v=inp.value.replace(/[^a-z]/gi,'');inp.value=v.toUpperCase();if(v&&inputs[i+1])inputs[i+1].focus();});
    onEnter(inp,()=>$('#check').click());
  });
  $('#check').onclick=()=>{
    const vals=inputs.map(i=>i.value.trim().toUpperCase());
    if(vals.some(v=>!v)){setMsg('Fill in all 5 wires. 五條線都要填。');return;}
    const bad=[];
    vals.forEach((v,i)=>{const good=v===SECRET[i];inputs[i].classList.remove('ok','bad');inputs[i].classList.add(good?'ok':'bad');if(!good)bad.push(i+1);});
    if(bad.length){
      SFX.buzz();zap();
      setMsg('Wire '+bad.join(', ')+(bad.length>1?' are':' is')+' not right. Check the fuse letters and the wire order. 檢查字母和接線順序。');
      shake($('.lockin'));return;
    }
    sync();S.endTs=Date.now();S.finalMs=S.endTs-S.startTs+hintsTotal()*PEN;save();tick();TTS.stop();SFX.fanfare();renderReceipt(true);
  };
  wireCommon('final',()=>{
    const n=S.hints.final||0;
    if(n===0)showHint('Look at <b>Wire order</b>. Wire 1 takes the letter from Fuse '+WIRE[0]+'. 看「接線順序」，第 1 條線用保險絲 '+WIRE[0]+' 的字母。');
    else if(n===1)showHint('Wire 1 = '+symOf(WIRE[0])+'. Wire 2 takes the letter from Fuse '+WIRE[1]+'. 第 1 條線是 '+symOf(WIRE[0])+'。');
    else showHint('The first two letters are <b>'+symOf(WIRE[0])+symOf(WIRE[1])+'</b>. 前兩個字母是 '+symOf(WIRE[0])+symOf(WIRE[1])+'。');
    return true;
  });
}
function renderReceipt(){
  const rows=STATIONS.map(st=>{const d=S.done[st.key];const w=S.wrong[st.key]||0;return `<div class="row"><span>${d?'[x]':'[ ]'} ${st.id}. ${esc(st.title)}</span><b>${d?fmt(d.t):'not done'}${d&&w?' ·✘'+w:''}</b></div>`;}).join('');
  const raw=S.endTs-S.startTs,pen=hintsTotal()*PEN;
  $('#view').innerHTML=`
  <a class="back" href="#home">← Menu 選單</a>
  <div class="msg info">📸 Take a screenshot of this receipt and show your teacher. 請截圖這張收據給老師看。</div>
  <div class="receipt" id="receipt">
    <h2>Ghost Ban-doh: Lights Out!</h2><div class="c">THE LIGHTS ARE ON!</div><div class="lamps" aria-hidden="true">🏮🏮🏮🏮🏮</div><hr>
    <div class="name">${esc(S.name)}${S.seat?' (#'+esc(S.seat)+')':''}</div>
    ${S.grp?`<div class="c">Group ${esc(S.grp)}</div>`:''}
    <div class="spell">${SECRET}</div><hr>
    <div class="row"><span>Finished</span><b>${stamp(S.endTs)}</b></div>
    <div class="row"><span>Time</span><b>${fmt(raw)}</b></div>
    <div class="row"><span>Hint penalty</span><b>+${fmt(pen)}</b></div>
    <div class="row"><span>Total time</span><b>${fmt(S.finalMs)}</b></div>
    <div class="row"><span>Hints used</span><b>${hintsTotal()}</b></div>
    <div class="row"><span>Wrong answers</span><b>${wrongTotal()}</b></div><hr>
    ${rows}<hr>
    <div class="c">Thank you! Happy Halloween 🎃</div>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- router ---------- */
function route(){
  sync();TTS.stop();
  const h=(location.hash||'#home').slice(1);
  window.scrollTo(0,0);
  tick();
  showLock();
  if(!S.startTs)return renderStart(h);
  if(h==='final')return renderFinal();
  const fn={s1:renderS1,s2:renderS2,s3:renderS3,s4:renderS4,s5:renderS5}[h];
  const st=STATIONS.find(s=>s.key===h);
  if(fn&&st)return fn(st);
  renderHome();
}
window.addEventListener('hashchange',route);
wireSfxBtn();
route();
})();
</script>
